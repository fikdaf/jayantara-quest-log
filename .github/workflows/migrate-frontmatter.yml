name: Migrate Quest Frontmatter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add frontmatter to all quests
        run: python3 scripts/add_frontmatter.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quests/
          git commit -m "chore: migrate quests to structured frontmatter"
          git push
