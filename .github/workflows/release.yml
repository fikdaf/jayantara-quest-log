name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run build --workspace @jayantara/web
      - run: npm run package --workspace @jayantara/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: jayantara-${{ matrix.artifact }}
          path: apps/desktop/release/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" apps/desktop/release/* --title "Jayantara Quest Log $TAG" --generate-notes
