name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build --workspace @jayantara/web
      - name: Validate PWA output
        shell: bash
        run: |
          set -euo pipefail
          for f in apps/web/dist/index.html apps/web/dist/manifest.webmanifest apps/web/dist/sw.js apps/web/dist/icons/icon.svg; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayantara-web
          path: apps/web/dist
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:core
      - run: npm run package --workspace @jayantara/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: jayantara-desktop-${{ matrix.os }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jayantara-*
          path: release-assets
          merge-multiple: true
      - name: Show release assets
        run: find release-assets -type f -maxdepth 3 -print
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "Jayantara Quest Log $TAG" --generate-notes
          fi
