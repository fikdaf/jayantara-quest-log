name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:core
      - run: npm run build --workspace @jayantara/web
      - run: npm run package --workspace @jayantara/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: jayantara-${{ matrix.artifact }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jayantara-*
          path: release-assets
          merge-multiple: false
      - name: Show release assets
        run: find release-assets -type f -maxdepth 3 -print
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          test -n "$TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Jayantara Quest Log $TAG" --generate-notes
          find release-assets -type f -print0 | xargs -0 -r gh release upload "$TAG" --clobber
