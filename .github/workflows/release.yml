name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install workspace dependencies
        run: npm install --workspaces --include-workspace-root --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build --workspace @jayantara/web
      - name: Validate PWA output
        shell: bash
        run: |
          set -euo pipefail
          for f in apps/web/dist/index.html apps/web/dist/manifest.webmanifest apps/web/dist/sw.js apps/web/dist/icons/icon.svg; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jayantara-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install workspace dependencies
        shell: bash
        run: npm install --workspaces --include-workspace-root --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: npm run build:core
      - name: Package desktop
        working-directory: apps/desktop
        shell: bash
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: jayantara-desktop-${{ matrix.os }}
          path: apps/desktop/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: jayantara-desktop-ubuntu-latest
          path: release-assets/linux
      - name: Download macOS desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: jayantara-desktop-macos-latest
          path: release-assets/macos
      - name: Download Windows desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: jayantara-desktop-windows-latest
          path: release-assets/windows
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-upload
          mkdir -p release-upload
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            base="$(basename "$file")"
            case "$file" in
              release-assets/linux/*) prefix="linux" ;;
              release-assets/macos/*) prefix="macos" ;;
              release-assets/windows/*) prefix="windows" ;;
              *) echo "Unexpected release path: $file" >&2; exit 1 ;;
            esac
            cp -- "$file" "release-upload/${prefix}-${base}"
          done < <(find release-assets -type f -print0)
          test "$count" -gt 0
          find release-upload -maxdepth 1 -type f -print
      - name: Validate release file types
        shell: bash
        run: |
          set -euo pipefail
          find release-upload -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
            case "$file" in
              *.exe|*.dmg|*.AppImage) ;;
              *) echo "Unexpected release asset: $file" >&2; exit 1 ;;
            esac
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAG"
          test -n "$GH_REPO"
          mapfile -d '' assets < <(find release-upload -maxdepth 1 -type f -print0)
          test "${#assets[@]}" -gt 0
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            for file in "${assets[@]}"; do
              gh release upload "$TAG" "$file" --repo "$GH_REPO" --clobber
            done
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GH_REPO" --title "Jayantara Quest Log $TAG" --generate-notes
          fi
