name: Validate Quest Content

on:
  push:
    paths:
      - 'quests/**'
      - 'data/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/validate-quests.yml'
  pull_request:
    paths:
      - 'quests/**'
      - 'data/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/validate-quests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-quests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify repository files
        run: |
          test -f schemas/quest-frontmatter.schema.json
          test -f schemas/progress-state.schema.json
          test -f scripts/validate_quests.py
          test -f scripts/check_frontmatter.py
          test -f scripts/validate_curriculum.py
          test -f scripts/validate_dependencies.py
          test -f scripts/validate_progression.py
          test -f scripts/validate_badges.py
          test -f scripts/resolve_progress.py
          test -f scripts/test_progress.py
          test -f scripts/complete_quest.py
          test -f scripts/test_complete_quest.py
          test -f scripts/complete_progress.py
          test -f scripts/test_complete_progress.py
          test -f scripts/save_progress.py
          test -f scripts/test_save_progress.py
          test -f scripts/test_complete_progress_persistence.py
          test -f scripts/build_curriculum.py
          test -f scripts/calculate_xp.py
          test -f data/badges.yaml
          test -f data/curriculum.yaml
          test -f data/xp-rules.yaml
          test -f data/progression.yaml
          test -f data/progress-state.example.json
          test -d quests
      - name: Validate schema JSON
        run: |
          python -m json.tool schemas/quest-frontmatter.schema.json > /dev/null
          python -m json.tool schemas/progress-state.schema.json > /dev/null
      - name: Validate progress state example
        run: python -m json.tool data/progress-state.example.json > /dev/null
      - name: Validate quest structure
        run: python scripts/validate_quests.py
      - name: Validate frontmatter schema
        run: python scripts/check_frontmatter.py
      - name: Validate curriculum metadata
        run: python scripts/validate_curriculum.py
      - name: Validate prerequisite graph
        run: python scripts/validate_dependencies.py
      - name: Validate progression rules
        run: python scripts/validate_progression.py
      - name: Validate badge rules
        run: python scripts/validate_badges.py
      - name: Validate Python scripts
        run: python -m py_compile scripts/*.py
      - name: Run progress resolver regression tests
        run: python scripts/test_progress.py
      - name: Run quest completion regression tests
        run: python scripts/test_complete_quest.py
      - name: Run transactional progress regression tests
        run: python scripts/test_complete_progress.py
      - name: Run progress persistence regression tests
        run: python scripts/test_save_progress.py
      - name: Run completion persistence integration test
        run: python scripts/test_complete_progress_persistence.py
      - name: Calculate XP
        run: python scripts/calculate_xp.py
      - name: Smoke test transactional progress JSON
        run: |
          python scripts/complete_progress.py --json 1 > /tmp/progress.json
          python -m json.tool /tmp/progress.json > /dev/null
          python scripts/complete_progress.py --json 5 1 2 3 4 > /tmp/progress-day5.json
          python -m json.tool /tmp/progress-day5.json > /dev/null
      - name: Smoke test persistent progress
        run: |
          python scripts/complete_progress.py --save --state-file /tmp/progress-state.json 1
          python -m json.tool /tmp/progress-state.json > /dev/null
      - name: Build generated quest index
        run: python scripts/build_curriculum.py
      - name: Validate generated index
        run: python -m json.tool data/quests.generated.json > /dev/null
