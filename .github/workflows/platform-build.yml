name: Platform Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/platform-build.yml'
  workflow_dispatch:

jobs:
  web:
    name: Web / PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install all workspace dependencies
        run: npm install --workspaces --include-workspace-root --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Build core package
        run: npm run build:core
      - name: Build web
        working-directory: apps/web
        run: npm run build
      - name: Validate PWA output
        working-directory: apps/web
        run: node -e "const fs=require('fs'); for (const f of ['dist/index.html','dist/manifest.webmanifest','dist/sw.js','dist/icons/icon.svg']) { if (!fs.existsSync(f)) throw new Error('Missing '+f); } console.log('PWA output OK')"
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: jayantara-web-pwa
          path: apps/web/dist
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install all workspace dependencies
        run: npm install --workspaces --include-workspace-root --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Build core package
        run: npm run build:core
      - name: Build web shell
        working-directory: apps/web
        run: npm run build

  mobile:
    name: Mobile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install all workspace dependencies
        run: npm install --workspaces --include-workspace-root --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Build core package
        run: npm run build:core
      - name: Validate mobile package
        working-directory: apps/mobile
        run: node -e "const p=require('./package.json'); if(p.name!=='@jayantara/mobile'||!p.dependencies?.expo||!p.dependencies?.react||!p.dependencies?.['react-native']) process.exit(1); console.log('mobile package manifest OK')"
