name: Platform Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/platform-build.yml'
  workflow_dispatch:

jobs:
  web:
    name: Web / PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install all workspace dependencies
        run: npm install --workspaces --include-workspace-root --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Build web
        working-directory: apps/web
        run: npm run build

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install all workspace dependencies
        run: npm install --workspaces --include-workspace-root --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Build web shell
        working-directory: apps/web
        run: npm run build

  mobile:
    name: Mobile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install all workspace dependencies
        run: npm install --workspaces --include-workspace-root --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Validate mobile package
        working-directory: apps/mobile
        run: node -e "const p=require('./package.json'); if(p.name!=='@jayantara/mobile'||!p.dependencies?.expo||!p.dependencies?.react||!p.dependencies?.['react-native']) process.exit(1); console.log('mobile package manifest OK')"
