version: 1
course:
  id: jayantara-nihongo-master-kit
  title: JAYANTARA NIHONGO MASTER-KIT
  duration_days: 30
  level: N5

phases:
  - id: foundation
    name: Foundation
    days: [1, 2, 3, 4, 5]
    focus: Hiragana, Katakana, salam, perkenalan, checkpoint pemula
    reward: rookie
  - id: novice
    name: Novice
    days: [6, 7, 8, 9, 10]
    focus: Angka, waktu, kalender, benda, verba, simulasi belanja
    reward: silver
  - id: adept
    name: Adept Warrior
    days: [11, 12, 13, 14, 15]
    focus: Kata sifat, lokasi, arah, perbandingan, review grammar N5
    reward: adept-warrior
  - id: kanji
    name: Kanji Apprentice
    days: [16, 17, 18, 19, 20]
    focus: Kanji dasar N5 dan review spaced repetition
    reward: kanji-apprentice
  - id: workplace
    name: Japan Ready
    days: [21, 22, 23, 24, 25]
    focus: Instruksi kerja, keselamatan, industri, kaigo, teknik, magang
    reward: japan-ready
  - id: career
    name: Interview Master
    days: [26, 27, 28, 29, 30]
    focus: Rirekisho, mensetsu, etika kerja, roleplay, final assessment
    reward: gold-jayantara

